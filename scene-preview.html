<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lucky Farm - Scene Preview M1</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172a19;font:14px system-ui;color:#fff}#scene{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#scene:active{cursor:grabbing}#world{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;will-change:transform}#world img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}.hotspot{position:absolute;width:54px;height:54px;border:2px solid #fff9;background:#134b3299;border-radius:50%;font-size:25px;color:white;box-shadow:0 3px 12px #0008;transform:translate(-50%,-50%);cursor:pointer;animation:bob 2s ease-in-out infinite}.hotspot:focus-visible{outline:3px solid gold}@keyframes bob{50%{translate:0 -6px}}header{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}header span,.panel,.toolbar{background:#173c2cdd;backdrop-filter:blur(9px);border:1px solid #ffffff40;border-radius:15px;padding:10px 13px;box-shadow:0 4px 14px #0005}header span{font-weight:800}.toolbar{position:fixed;right:12px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:8px}.toolbar button,.panel button{border:0;background:#ffdd78;color:#3c2c0d;border-radius:10px;padding:9px 12px;font-weight:800}.panel{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:390px;display:none}.panel.show{display:block}.panel h2{margin:0 0 8px;font-size:19px}.panel p{line-height:1.5;margin:6px 0 12px}.hint{position:fixed;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));font-size:12px;background:#173c2cdd;border-radius:10px;padding:10px;max-width:53vw}a{color:#ffe28d}
</style></head><body><div id="scene"><div id="world"><img src="farm-scene.png" alt="Phối cảnh nông trại chất lượng cao"><button class="hotspot" style="left:52%;top:36%" data-name="Chuồng gà" data-desc="Khu chuồng gà. Mốc tiếp theo: liên kết vật nuôi thực tế và animation 3D." aria-label="Chuồng gà">🐔</button><button class="hotspot" style="left:22%;top:40%" data-name="Chuồng bò" data-desc="Khu chuồng bò và máng ăn. Mốc tiếp theo: mô hình bò GLB chuyển động." aria-label="Chuồng bò">🐄</button><button class="hotspot" style="left:67%;top:54%" data-name="Vườn trồng" data-desc="Khu trồng trọt. Mốc tiếp theo: 25 ô đất tương tác với cây sinh trưởng." aria-label="Vườn trồng">🌽</button><button class="hotspot" style="left:81%;top:20%" data-name="Nhà kho" data-desc="Nơi quản lý hạt giống, vật tư và đồ trang trí." aria-label="Nhà kho">🏠</button><button class="hotspot" style="left:24%;top:80%" data-name="Khu hồ nước" data-desc="Khu thu nước mưa và dự trữ nước tưới." aria-label="Hồ nước">💧</button></div></div><header><span>🌾 Lucky Farm · Cảnh mẫu M1</span><span>🎨 Chất lượng cao</span></header><div class="hint">Vuốt để di chuyển · Chụm 2 ngón để phóng to · Chạm biểu tượng để xem khu vực</div><div class="toolbar"><button id="minus" aria-label="Thu nhỏ">−</button><button id="reset">⌂</button><button id="plus" aria-label="Phóng to">+</button></div><section class="panel" id="panel"><h2 id="name"></h2><p id="desc"></p><button id="close">Đóng</button></section><script>
const scene=document.getElementById('scene'),world=document.getElementById('world'),panel=document.getElementById('panel');const W=1536,H=1024;let scale=1,x=0,y=0;const fingers=new Map();let prevMid=null,prevDist=0;function clamp(v,a,b){return Math.min(b,Math.max(a,v))}function render(){const vw=innerWidth,vh=innerHeight;const loX=Math.min(0,vw-W*scale),loY=Math.min(0,vh-H*scale);x=clamp(x,loX,Math.max(0,vw-W*scale));y=clamp(y,loY,Math.max(0,vh-H*scale));world.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function reset(){scale=Math.max(innerWidth/W,innerHeight/H);x=(innerWidth-W*scale)/2;y=(innerHeight-H*scale)/2;render()}function zoom(f,cx=innerWidth/2,cy=innerHeight/2){const ns=clamp(scale*f,Math.max(innerWidth/W,innerHeight/H),3);x=cx-(cx-x)*ns/scale;y=cy-(cy-y)*ns/scale;scale=ns;render()}scene.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;scene.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});prevMid=null});scene.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;const old=fingers.get(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...fingers.values()];if(a.length===1){x+=e.clientX-old.x;y+=e.clientY-old.y;render()}else if(a.length===2){const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(prevMid){x+=mid.x-prevMid.x;y+=mid.y-prevMid.y;if(prevDist)zoom(dist/prevDist,mid.x,mid.y)}prevMid=mid;prevDist=dist;render()}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])scene.addEventListener(ev,e=>{fingers.delete(e.pointerId);prevMid=null;prevDist=0});scene.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);document.getElementById('reset').onclick=reset;document.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>{document.getElementById('name').textContent=b.dataset.name;document.getElementById('desc').textContent=b.dataset.desc;panel.classList.add('show');if(window.parent!==window)window.parent.postMessage({luckyZone:b.dataset.name},location.origin)});document.getElementById('close').onclick=()=>panel.classList.remove('show');addEventListener('resize',reset);reset();
</script></body></html>
