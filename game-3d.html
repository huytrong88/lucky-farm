function updateWorms(b,p,k,now){if(!p?.pest||!b.obj||!b.soil.visible){if(b.worms)b.worms.visible=false;return}if(!b.worms){b.worms=new THREE.Group();scene.add(b.worms);for(let n=0;n<3;n++){const w=new THREE.Group();w.userData.segments=[];for(let j=0;j<6;j++){const m=new THREE.Mesh(wormGeo,j===0?wormHead:wormMat);m.scale.set(1.15,1,1);w.add(m);w.userData.segments.push(m)}for(const side of [-1,1]){const eye=new THREE.Mesh(wormGeo,wormEye);eye.scale.setScalar(.23);eye.position.set(.085,.065,side*.075);w.userData.segments[0].add(eye)}b.worms.add(w)}}b.worms.visible=true;b.worms.position.set(b.x,0,b.z);for(let n=0;n<3;n++){const w=b.worms.children[n],a=now*.0012+n*2.094+k;w.position.set(.62*Math.cos(a),.18+.45*growth(p)+.08*Math.sin(a*2),.62*Math.sin(a));w.rotation.y=-a-Math.PI/2;w.userData.segments.forEach((m,j)=>{m.position.set(-j*.15,.08*Math.sin(now*.009-j*.85),.045*Math.sin(now*.006-j*.6))})}}
function statusTexture(kind){const c=document.createElement('canvas');c.width=c.height=128;const ctx=c.getContext('2d');ctx.lineJoin='round';ctx.shadowColor='#173e3855';ctx.shadowBlur=7;ctx.fillStyle='#fffef3';ctx.strokeStyle=kind==='water'?'#49a8df':'#76a745';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(64,119);ctx.lineTo(49,101);ctx.bezierCurveTo(2,91,4,12,64,9);ctx.bezierCurveTo(124,12,126,91,79,101);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;if(kind==='water'){ctx.fillStyle='#32a7ed';ctx.beginPath();ctx.moveTo(64,24);ctx.bezierCurveTo(56,40,37,56,37,70);ctx.arc(64,70,27,Math.PI,0,true);ctx.bezierCurveTo(91,56,72,40,64,24);ctx.fill();ctx.strokeStyle='#c9f2ff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(49,62);ctx.quadraticCurveTo(44,75,55,81);ctx.stroke()}else{ctx.strokeStyle='#98602e';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(46,91);ctx.lineTo(68,59);ctx.stroke();ctx.fillStyle='#a8b9bf';ctx.strokeStyle='#52686c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(66,65);ctx.bezierCurveTo(100,58,105,26,66,23);ctx.bezierCurveTo(87,38,79,48,60,53);ctx.closePath();ctx.fill();ctx.stroke()}const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex}
const plotStatusMaterials={water:new THREE.SpriteMaterial({map:statusTexture('water'),depthTest:false,depthWrite:false,transparent:true}),harvest:new THREE.SpriteMaterial({map:statusTexture('harvest'),depthTest:false,depthWrite:false,transparent:true})};
function updatePlotStatus(b,p,k,now){let kind=null;if(p&&b.soil.visible){const g=growth(p,now);if(g>=1&&!p.pest)kind='harvest';else if(g<1&&now>=p.dryAt)kind='water'}if(!kind){if(b.statusBubble)b.statusBubble.visible=false;return}if(!b.statusBubble){b.statusBubble=new THREE.Sprite(plotStatusMaterials[kind]);b.statusBubble.renderOrder=100;scene.add(b.statusBubble)}const o=b.statusBubble;o.material=plotStatusMaterials[kind];o.visible=true;const height=b.obj?new THREE.Box3().setFromObject(b.obj).max.y:0;const scale=1.25/Math.sqrt(zoom);o.scale.set(scale,scale,1);o.position.set(b.x,Math.max(.5,height)+scale*.55+.12*Math.sin(now*.004+k),b.z)}
let t=0;function frame(){requestAnimationFrame(frame);animateFarmer();updateWork();updatePreview();updateWeather();updateFarmAlerts();t+=.015;for(const a of animated){if(a.obj===dragObject||!a.obj.visible)continue;a.obj.position.x=a.x+Math.sin(t*.6+a.phase)*a.radius;a.obj.position.z=a.z+Math.cos(t*.6+a.phase)*a.radius;a.obj.rotation.y=Math.sin(t*.6+a.phase)*.3}for(let k=0;k<beds.length;k++){const p=game.plots[k],b=beds[k];if(p&&b.obj)b.obj.scale.y=b.base*(.35+.65*Math.min(1,Math.max(0,growth(p))));updateWorms(b,p,k,performance.now());updatePlotStatus(b,p,k,Date.now())}renderer.render(scene,camera)}document.querySelector('#loading').hidden=true;notice('Nhấn giữ vật phẩm để chỉnh vị trí · Chụm hai ngón để zoom');frame();
