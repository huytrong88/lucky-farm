function groundAt(e){pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),new THREE.Vector3())}
function pickAt(e){groundAt(e);const hit=ray.intersectObjects(selectables.filter(c=>c.userData.root?.visible!==false&&c.visible),false)[0];let o=hit?.object.userData.root;if(Number.isInteger(o?.userData.plot))o=beds[o.userData.plot].soil;return o&&(o.userData.layoutId||Number.isInteger(o.userData.decorId))?o:null}
function moveLayout(o,x,z){const dx=x-o.position.x,dz=z-o.position.z;o.position.x=x;o.position.z=z;if(Number.isInteger(o.userData.plot)){const b=beds[o.userData.plot];b.x+=dx;b.z+=dz;if(b.obj){b.obj.position.x+=dx;b.obj.position.z+=dz}}if(o.userData.pond){pondSurface.position.x+=dx;pondSurface.position.z+=dz}for(const a of animated)if(a.obj===o){a.x+=dx;a.z+=dz}}
function visibleLayout(o,v){o.visible=v;if(Number.isInteger(o.userData.plot)){const b=beds[o.userData.plot];if(b.obj)b.obj.visible=v}if(o.userData.pond)pondSurface.visible=v}
function persistLayout(o){if(Number.isInteger(o.userData.decorId)){const i=o.userData.decorId,p=game.positions[i];p.x=o.position.x;p.z=o.position.z;p.angle=o.rotation.y;p.stored=!o.visible}else game.layout[o.userData.layoutId]={x:o.position.x,z:o.position.z,angle:o.rotation.y,stored:!o.visible};save()}
function layoutMenu(o){showMenu(o.userData.label||'Ô ruộng '+(o.userData.plot+1),[{label:'Di chuyển',run:()=>{editing=null;care=null;dragObject=o;dragStart=null;menu.hidden=true;notice('Chạm và kéo vật phẩm đến vị trí mới rồi thả tay')}},{label:'Xoay 90°',run:()=>{o.rotation.y+=Math.PI/2;if(Number.isInteger(o.userData.plot)&&beds[o.userData.plot].obj)beds[o.userData.plot].obj.rotation.y+=Math.PI/2;persistLayout(o);menu.hidden=true}},{label:'Cất vào kho',run:()=>{if(Number.isInteger(o.userData.decorId)){const i=o.userData.decorId;game.positions[i].stored=true;removeDecor(i);save()}else{visibleLayout(o,false);persistLayout(o)}menu.hidden=true;notice('Đã cất vào kho')}}])}
for(const [id,o] of layoutObjects){const p=game.layout[id];if(p){moveLayout(o,p.x,p.z);o.rotation.y=p.angle||0;visibleLayout(o,!p.stored)}}
function layoutInventory(){const rows=[...layoutObjects].filter(([id,o])=>!o.visible).map(([id,o])=>({label:(o.userData.label||'Ô ruộng '+(o.userData.plot+1))+' · ×1 · Đặt lại',run:()=>{visibleLayout(o,true);dragObject=o;dragStart=null;menu.hidden=true;notice('Kéo vật phẩm đến vị trí mới');persistLayout(o)}}));showMenu('Kho công trình và ruộng',rows.length?rows:[{label:'Kho công trình trống',run:()=>{}}])}
const oldInventory=inventory;inventory=function(tab){if(tab==='layout')return layoutInventory();oldInventory(tab)};invTabs.push(['layout','Công trình']);
let quickCollapsed=[false,false],quickScroll=[0,0];function refreshQuick(){const tools=[{name:'Làm đất',icon:'🪏',active:tillMode,run:()=>{tillMode=true;care=null;notice('Chạm ô đất trống để làm đất');refreshQuick()}},...supplies.map((a,i)=>({name:i===1?'Thuốc sâu':a.name,icon:a.icon,qty:game.supplies[i],active:care===i,run:()=>{if(!game.supplies[i])return notice('Hết vật tư');tillMode=false;care=i;notice('Chạm cây đang lớn để dùng '+a.name);refreshQuick()}}))];const seeds=[...crops.map((c,i)=>({name:c.name,model:c.model,qty:game.seeds[i],active:!tillMode&&care===null&&chosen===i,run:()=>{if(level()<unlock[i])return notice('Cần cấp '+unlock[i]);if(!game.seeds[i])return notice('Hết hạt giống');tillMode=false;care=null;chosen=i;document.querySelector('#grow').textContent='🌱 '+c.name;notice('Chạm ô đất trống để gieo '+c.name);refreshQuick()}})),...livestock.map((a,i)=>({name:a.name,model:animalModels[i],qty:game.herd[i],run:()=>{tillMode=false;care=null;animalMenu();refreshQuick()}}))];[tools,seeds].forEach((items,k)=>{const el=document.querySelector(k?'#quickSeeds':'#quickTools');const previous=el.querySelector('.quickscroll');if(previous)quickScroll[k]=previous.scrollTop;el.replaceChildren();el.classList.toggle('collapsed',quickCollapsed[k]);const title=k?'Hạt giống':'Công cụ';const toggle=document.createElement('button');toggle.className='quicktoggle';toggle.setAttribute('aria-expanded',String(!quickCollapsed[k]));toggle.setAttribute('aria-label',title+' '+(quickCollapsed[k]?'mở rộng':'thu gọn'));toggle.textContent=(k?'🌱':'🛠')+' '+title+' '+(quickCollapsed[k]?'▲':'▼');toggle.onclick=()=>{quickCollapsed[k]=!quickCollapsed[k];refreshQuick()};if(quickCollapsed[k]){el.append(toggle);return}const h=document.createElement('strong');h.textContent=title;el.append(h);const scroll=document.createElement('div');scroll.className='quickscroll';scroll.addEventListener('scroll',()=>quickScroll[k]=scroll.scrollTop,{passive:true});for(const a of items.filter(a=>a.qty===undefined||a.qty>0)){const b=document.createElement('button');b.className='slot'+(a.active?' active':'');const img=document.createElement('img');img.src=thumbnail(a.model,a.icon||'🌱');img.alt=a.name;const label=document.createElement('span');label.textContent=a.name;b.append(img,label);if(a.qty!==undefined){const q=document.createElement('span');q.className='qty';q.textContent='×'+a.qty;b.append(q)}b.onclick=a.run;scroll.append(b)}el.append(scroll,toggle);scroll.scrollTop=quickScroll[k]})}refreshQuick();
let t=0;function frame(){requestAnimationFrame(frame);animateFarmer();updatePreview();t+=.015;for(const a of animated){if(a.obj===dragObject||!a.obj.visible)continue;a.obj.position.x=a.x+Math.sin(t*.6+a.phase)*a.radius;a.obj.position.z=a.z+Math.cos(t*.6+a.phase)*a.radius;a.obj.rotation.y=Math.sin(t*.6+a.phase)*.3}for(let k=0;k<beds.length;k++){const p=game.plots[k],b=beds[k];if(p&&b.obj)b.obj.scale.y=b.base*(.35+.65*Math.min(1,Math.max(0,(Date.now()-p.at)/crops[p.type].ms)))}renderer.render(scene,camera)}document.querySelector('#loading').hidden=true;notice('Nhấn giữ vật phẩm để chỉnh vị trí · Chụm hai ngón để zoom');frame();
</script></body></html>
