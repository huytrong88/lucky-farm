const farmer=new THREE.Group();scene.add(farmer);farmer.position.set(-5,0,7);
function part(w,h,d,color,x,y,z,parent=farmer){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
part(.48,.62,.32,0x397a9b,0,.88,0);part(.38,.36,.36,0xf0bd87,0,1.39,0);part(.68,.09,.62,0xc69b50,0,1.6,0);part(.4,.18,.4,0xe0b75e,0,1.72,0);
const limbs=[];for(const side of [-1,1]){const leg=new THREE.Group();leg.position.set(side*.14,.57,0);farmer.add(leg);part(.19,.48,.22,0x344c66,0,-.24,0,leg);part(.21,.13,.34,0x61462e,0,-.5,.06,leg);const arm=new THREE.Group();arm.position.set(side*.32,1.13,0);farmer.add(arm);part(.16,.48,.17,0xf0bd87,0,-.22,0,arm);limbs.push({leg,arm,side})}
const destination=farmer.position.clone();function sendFarmer(k){const b=beds[k];destination.set(b.x+1.4,0,b.z+1.4)}
const clock=new THREE.Clock();function animateFarmer(){const dt=Math.min(clock.getDelta(),.05),dx=destination.x-farmer.position.x,dz=destination.z-farmer.position.z,dist=Math.hypot(dx,dz);if(dist>.04){const step=Math.min(dist,dt*5);farmer.position.x+=dx/dist*step;farmer.position.z+=dz/dist*step;farmer.rotation.y=Math.atan2(dx,dz)}for(const l of limbs){const swing=dist>.04?Math.sin(performance.now()*.012)*.55*l.side:0;l.leg.rotation.x=swing;l.arm.rotation.x=-swing}}
document.querySelector('#level').onclick=()=>showMenu('Cấp '+level()+' · '+game.xp+' XP',livestock.map((a,i)=>({label:'Nâng cấp chuồng '+a.name+' · '+game.upgrades[i]+'/2 · '+(game.upgrades[i]>=2?'Tối đa':(80+game.upgrades[i]*60)+' xu'),run:()=>{const n=game.upgrades[i],cost=80+n*60;if(n>=2)return;if(level()<n+2)return notice('Cần cấp '+(n+2));if(game.coins<cost)return notice('Không đủ xu');game.coins-=cost;game.upgrades[i]++;save();document.querySelector('#level').click()}})));
let t=0;function frame(){requestAnimationFrame(frame);animateFarmer();t+=.015;for(const a of animated){a.obj.position.x=a.x+Math.sin(t*.6+a.phase)*a.radius;a.obj.position.z=a.z+Math.cos(t*.6+a.phase)*a.radius;a.obj.rotation.y=Math.sin(t*.6+a.phase)*.3}for(let k=0;k<beds.length;k++){const p=game.plots[k],b=beds[k];if(p&&b.obj)b.obj.scale.y=b.base*(.35+.65*Math.min(1,Math.max(0,(Date.now()-p.at)/crops[p.type].ms)))}renderer.render(scene,camera)}document.querySelector('#loading').hidden=true;notice('v5.3: Tích XP, nâng cấp chuồng và đặt vật trang trí từ kho.');frame();
</script></body></html>
