<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lucky Farm | GLB 3D World</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#bce8f4;color:#24442e}canvas{display:block;touch-action:none}button,a{font:inherit;cursor:pointer}#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}#top>*{pointer-events:auto}.panel{border-radius:15px;background:#fffdf0ed;box-shadow:0 5px 20px #224a3650;padding:10px 13px;font-weight:750}small{display:block;color:#65856b;font-size:11px;font-weight:500}a{background:#367d51;color:white;padding:11px;border-radius:12px;text-decoration:none;font-size:12px}#actions{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{border:1px solid #d6e6c9;background:#fffdf0;color:#315b37;border-radius:12px;padding:10px 12px;font-weight:750;box-shadow:0 3px 10px #1e4c3340}#notice{position:fixed;left:10px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:min(90vw,420px);font-size:13px;line-height:1.45}#loading{position:fixed;inset:0;background:#d7f1db;display:grid;place-content:center;text-align:center;gap:12px;z-index:4}#loading span{font-size:13px;color:#3b6346}#loading[hidden]{display:none}#minimap{position:fixed;right:10px;top:74px;background:#fffdf0e8;padding:8px;border-radius:12px;font-size:11px;max-width:150px}#minimap[hidden]{display:none}
</style></head><body><div id="loading"><strong>🌿 Đang dựng nông trại 3D thật</strong><span id="progress">Đang tải các mô hình GLB…</span></div><div id="top"><div class="panel">🌾 Lucky Farm 3D <small>M3 · Mô hình GLB thật · Bản xem thử độc lập</small></div><a href="/index.html">Game v4.1</a></div><div id="minimap">Vuốt để di chuyển · chạm đối tượng · chụm để zoom</div><div id="notice" class="panel">Chạm vào nhà, chuồng, cây hoặc vật nuôi để xem thông tin.</div><div id="actions"><button data-move="left">◀</button><button data-move="up">▲</button><button data-move="down">▼</button><button data-move="right">▶</button><button id="zin">＋</button><button id="zout">－</button><button id="grow">🌱 Cây lớn lên</button><button id="reset">⌂</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#c8e8f4');scene.fog=new THREE.Fog('#c8e8f4',48,105);
const camera=new THREE.OrthographicCamera(-15,15,10,-10,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7c9b67,2.25));const sun=new THREE.DirectionalLight(0xfff0c5,3);sun.position.set(-18,35,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9})}function plane(w,d,c,x,z,y=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),mat(c));o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}
plane(75,75,0x85c669,0,0,-.16);plane(7,50,0xe8d2a2,-2,0,-.05);plane(43,3.3,0xe8d2a2,0,4,-.04);plane(11,12,0x9ad6e2,23,17,-.03);
const loader=new GLTFLoader();const cache=new Map(),selectables=[],animated=[];const required=['red-gambrel-barn','low-poly-chicken-coop','garden-greenhouse','chunky-low-poly-cow','corn-growth-stages','wheat-growth-stages','low-poly-fruit-trees','strawberry-growth-stages','garden-plot-kit','low-poly-farm-birds','wooden-fence-kit','farm-tractor-and-hay-trailer','low-poly-grain-silo','farm-produce-crates','sunflower-growth-stages','tomato-plant-growth-stages','carrot-growth-stages','farm-water-pump','chunky-cloud-sheep','chunky-pig-with-apples','low-poly-duck-pond','farm-water-pump','harvest-wheelbarrow','seed-shop-counter','low-poly-beehive-set'];
let done=0;await Promise.all([...new Set(required)].map(async name=>{try{const gltf=await loader.loadAsync('./assets/'+name+'.glb');cache.set(name,gltf); }catch(e){console.warn('Asset load failed',name,e)}done++;document.querySelector('#progress').textContent='Đã tải '+done+'/'+new Set(required).size+' mô hình GLB'}));
function add(name,x,z,width=3,label=name,angle=0){const src=cache.get(name);if(!src)return null;const obj=src.scene.clone(true);const bounds=new THREE.Box3().setFromObject(obj);const size=bounds.getSize(new THREE.Vector3());const max=Math.max(size.x,size.z,.01);const factor=width/max;obj.scale.multiplyScalar(factor);obj.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(obj);const center=b.getCenter(new THREE.Vector3());obj.position.set(x-center.x,-b.min.y,z-center.z);obj.rotation.y=angle;obj.userData.label=label;obj.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;c.userData.root=obj;selectables.push(c)}});scene.add(obj);return obj}
add('red-gambrel-barn',-12,-12,8,'🏠 Nhà kho chính');add('low-poly-grain-silo',-19,-13,3,'🌾 Kho chứa ngũ cốc');add('farm-tractor-and-hay-trailer',-9,-5,6,'🚜 Máy kéo');add('garden-greenhouse',-17,12,6,'🌿 Nhà kính');add('low-poly-chicken-coop',11,-13,5,'🐔 Chuồng gà');add('garden-greenhouse',12,12,5,'🐄 Khu chuồng bò');add('seed-shop-counter',-10,7,3,'🛒 Cửa hàng hạt giống');add('farm-water-pump',-5,12,2,'💧 Trạm nước');add('harvest-wheelbarrow',-7,9,2,'🛒 Xe thu hoạch');add('farm-produce-crates',-9,11,3,'📦 Nông sản');add('low-poly-duck-pond',23,17,8,'🦆 Hồ vịt');add('low-poly-beehive-set',-22,6,2,'🐝 Tổ ong');
for(let i=0;i<6;i++){add('low-poly-fruit-trees',-25+i*4,22,3.6,'🌳 Cây ăn quả');add('low-poly-fruit-trees',-26+i*4,-24,3.7,'🌳 Vườn cây')}for(let i=0;i<5;i++)for(let j=0;j<5;j++){const x=-18+i*3.3,z=-2+j*3.3;plane(2.7,2.7,0x98683c,x,z,-.02);const name=['corn-growth-stages','strawberry-growth-stages','tomato-plant-growth-stages','carrot-growth-stages','wheat-growth-stages'][(i+j)%5];const obj=add(name,x,z,2.35,'🌱 '+name.replaceAll('-',' '));if(obj)obj.userData.crop=true}
for(let i=0;i<5;i++){add('wooden-fence-kit',5+i*2.4,-18,2.2,'🪵 Hàng rào');add('wooden-fence-kit',5+i*2.4,18,2.2,'🪵 Hàng rào');add('wooden-fence-kit',18,-14+i*6.2,2.2,'🪵 Hàng rào',Math.PI/2)}
for(let i=0;i<4;i++){const obj=add('low-poly-farm-birds',8+(i%2)*3,-9+Math.floor(i/2)*2,1.6,'🐓 Gà trong chuồng');if(obj)animated.push({obj,x:obj.position.x,z:obj.position.z,phase:i*1.7,radius:.28})}
for(let i=0;i<3;i++){const obj=add('chunky-low-poly-cow',8+i*2.6,9+(i%2)*3,2.2,'🐄 Bò trong chuồng');if(obj)animated.push({obj,x:obj.position.x,z:obj.position.z,phase:i*2,radius:.38})}
add('chunky-cloud-sheep',18,5,2.1,'🐑 Cừu');add('chunky-pig-with-apples',18,0,2.2,'🐖 Lợn');
let target=new THREE.Vector3(0,0,0),zoom=1;function update(){const aspect=innerWidth/innerHeight,span=13/zoom;camera.left=-span*aspect;camera.right=span*aspect;camera.top=span;camera.bottom=-span;camera.position.set(target.x+28,31,target.z+28);camera.lookAt(target);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}update();addEventListener('resize',update);
const canvas=renderer.domElement,points=new Map();let last=null,wasDrag=false,pinch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};wasDrag=false});canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){const p=[...points.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)zoom=THREE.MathUtils.clamp(zoom*dist/pinch,.65,2.2);pinch=dist;update();wasDrag=true;return}const dx=e.clientX-old.x,dy=e.clientY-old.y;if(Math.abs(dx)+Math.abs(dy)>1){target.x=THREE.MathUtils.clamp(target.x+(dy-dx)*.017/zoom,-25,25);target.z=THREE.MathUtils.clamp(target.z+(dy+dx)*.017/zoom,-25,25);update();wasDrag=true}});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('pointerup',e=>{if(!wasDrag&&points.size===1){pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(selectables,false)[0];if(hit){const root=hit.object.userData.root;document.querySelector('#notice').textContent=root?.userData.label||'Đối tượng 3D'}}points.delete(e.pointerId);pinch=null;last=null});canvas.addEventListener('pointercancel',e=>{points.delete(e.pointerId);pinch=null});
const directions={left:[-3,3],right:[3,-3],up:[-3,-3],down:[3,3]};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const d=directions[b.dataset.move];target.x=THREE.MathUtils.clamp(target.x+d[0],-25,25);target.z=THREE.MathUtils.clamp(target.z+d[1],-25,25);update()});document.querySelector('#zin').onclick=()=>{zoom=Math.min(2.2,zoom*1.2);update()};document.querySelector('#zout').onclick=()=>{zoom=Math.max(.65,zoom/1.2);update()};document.querySelector('#reset').onclick=()=>{target.set(0,0,0);zoom=1;update()};let stage=0;document.querySelector('#grow').onclick=()=>{stage=(stage+1)%4;scene.traverse(o=>{if(o.userData.crop)o.scale.y=[.45,.7,1,1.25][stage]});document.querySelector('#notice').textContent='🌱 Mô phỏng giai đoạn cây: '+(stage+1)+'/4 (chưa liên kết dữ liệu game)'};
let t=0;function frame(){requestAnimationFrame(frame);t+=.015;for(const a of animated){a.obj.position.x=a.x+Math.sin(t*.6+a.phase)*a.radius;a.obj.position.z=a.z+Math.cos(t*.6+a.phase)*a.radius;a.obj.rotation.y=Math.sin(t*.6+a.phase)*.3}renderer.render(scene,camera)}document.querySelector('#loading').hidden=true;document.querySelector('#notice').textContent='Đã nạp '+cache.size+' mô hình GLB. Vuốt bản đồ, chạm đối tượng để khám phá. Đây là bản dựng cảnh 3D, chưa tích hợp gameplay.';frame();
</script></body></html>
